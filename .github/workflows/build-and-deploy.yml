name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python --version
          python -m pip install setuptools
          python -m pip install -r requirements.txt
          python -m pip install attrs

      - name: Execute machine-learning notebook
        if: github.event_name == 'pull_request'
        run: |
          cd docs/data_handling
          jupyter nbconvert --to notebook --execute machine_learning_in_chemistry.ipynb --output /tmp/machine_learning_executed.ipynb --ExecutePreprocessor.timeout=120

      - name: Build Jupyter Book
        run: jupyter-book build .

      - name: Add project-root redirect
        run: |
          cat > _build/html/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=docs/intro.html">
              <link rel="canonical" href="docs/intro.html">
              <title>Coding for the Molecular Sciences</title>
            </head>
            <body>
              <p><a href="docs/intro.html">Go to Coding for the Molecular Sciences</a></p>
            </body>
          </html>
          EOF

      - name: Verify book output
        run: |
          test -f _build/html/index.html
          test -f _build/html/docs/intro.html
          test -d _build/html/_static

      - name: Prepare Basthon
        run: bash scripts/prepare_basthon.sh "_build/html/basthon"

      - name: Verify complete publish directory
        run: |
          test -f _build/html/index.html
          test -f _build/html/docs/intro.html
          test -f _build/html/basthon/index.html

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          publish_dir: ./_build/html
